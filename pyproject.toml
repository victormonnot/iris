[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iris-workbench"
version = "0.56.0"
description = "A local workbench to annotate images and videos, train vision models, and compare results"
readme = "README.md"
authors = [{ name = "Victor Monnot" }]
keywords = ["computer-vision", "object-detection", "annotation", "model-training", "tracking"]
# Archive contents have different licences; see THIRD_PARTY_NOTICES.md.
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/iris/_vendor/*/LICENSE",
    "src/iris/_vendor/*/NOTICE",
    "src/iris/_vendor/torchvision-LICENSE",
    "src/iris/static/fonts/*-OFL.txt",
    "examples/street-scenes/CREDITS.txt",
    "docs/media/README.md",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5",
  "pycocotools==2.0.11",
]

[project.urls]
Repository = "https://github.com/victormonnot/iris"
Documentation = "https://github.com/victormonnot/iris/blob/main/docs/README.md"
Portfolio = "https://victormonnot.com/projects/iris/"
Issues = "https://github.com/victormonnot/iris/issues"

[project.optional-dependencies]
ml = ["torch==2.10.0", "torchvision==0.25.0"]
tracking = ["scipy==1.17.1", "lap==0.5.12", "cython_bbox==0.1.5"]
onnx = [
    "onnx==1.20.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "ml" }]
torchvision = [{ index = "pytorch-cpu", extra = "ml" }]

[project.scripts]
iris = "iris.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github", "/src", "/tests", "/docs", "/examples",
    "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["src/iris/_vendor/**"]
