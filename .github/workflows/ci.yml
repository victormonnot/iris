name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Live checks require separately provisioned weights or a local model service.
  IRIS_TEST_MODEL_DIR: ""
  IRIS_TEST_TRAINING: "0"
  IRIS_TEST_OLLAMA: "0"

jobs:
  style-and-javascript:
    name: Ruff and JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: checks
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install check dependencies
        run: uv sync --locked --only-group dev
      - name: Lint
        run: uv run --offline --no-sync ruff check .
      - name: Check formatting
        run: uv run --offline --no-sync ruff format --check .
      - name: Test browser helpers
        run: node --test tests/js/*.test.cjs

  python-base:
    name: Base suite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: base-${{ matrix.python-version }}
      - name: Install base application and test dependencies
        run: uv sync --locked --group dev
      - name: Test base installation
        # -ra reports skipped optional/live checks separately from passed tests.
        run: uv run --offline --no-sync pytest -q -ra

  optional-cpu:
    name: Native CPU fixtures / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cpu-3.12
      - name: Install CPU model and tracking dependencies
        run: uv sync --locked --group dev --extra ml --extra tracking
      - name: Require the optional CPU runtime
        run: |
          uv run --offline --no-sync python - <<'PY'
          import cython_bbox
          import lap
          import scipy
          import torch
          import torchvision

          assert torch.version.cuda is None, "CI must use the locked CPU build"
          print(f"torch={torch.__version__}, torchvision={torchvision.__version__}")
          print(f"scipy={scipy.__version__}, lap={lap.__version__}")
          PY
      - name: Test native code with generated data and weights
        # No pretrained checkpoints, external provider or GPU is used here.
        run: |
          uv run --offline --no-sync pytest -q -ra --junitxml=cpu-tests.xml \
            tests/test_models_taxonomy.py \
            tests/test_training_state.py \
            tests/test_training_scopes.py \
            tests/test_training_devices.py \
            tests/test_training_architectures.py \
            tests/test_ssdlite_training.py \
            tests/test_yolox_training.py \
            tests/test_tracking.py \
            tests/test_temporal_tracker_vendor.py \
            tests/test_tracking_adapter_edges.py \
            tests/test_tracking_replay.py \
            tests/test_pipeline_runtime.py \
            tests/test_pipeline_detector_runtime.py
      - name: Require executed optional tests
        run: |
          uv run --offline --no-sync python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = ElementTree.fromstring(Path("cpu-tests.xml").read_text())
          cases = report.findall(".//testcase")
          skipped = [case.attrib["name"] for case in cases if case.find("skipped") is not None]
          assert cases, "The CPU fixture selection collected no tests"
          assert not skipped, f"Optional CPU tests were skipped: {skipped}"
          print(f"Executed {len(cases)} CPU fixture tests without skips")
          PY
