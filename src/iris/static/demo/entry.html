<dialog id="iris-demo-entry" class="iris-demo-entry" aria-label="Try IRIS"
  aria-describedby="iris-demo-entry-limits" open>
  <div class="iris-demo-entry-content">
    <button id="iris-demo-try" type="button" class="button button-primary" disabled>
      Try IRIS <span aria-hidden="true">→</span>
    </button>
    <p id="iris-demo-entry-limits">
      <span>Interactive demo with sample data.</span>
      Training, new model runs and your own files require a local installation.
    </p>
    <a class="iris-demo-install" href="https://github.com/victormonnot/iris/blob/main/docs/setup.md"
      target="_blank" rel="noopener noreferrer">Install IRIS locally <span aria-hidden="true">↗</span></a>
    <p id="iris-demo-entry-status" role="status" tabindex="-1">Loading the example…</p>
    <p id="iris-demo-entry-notice" hidden></p>
    <div class="iris-demo-entry-recovery">
      <a id="iris-demo-entry-retry" class="text-button" href="">Retry loading</a>
      <button id="iris-demo-entry-reset" type="button" class="text-button" hidden>Reset saved demo</button>
    </div>
    <noscript><p>Enable JavaScript to try the browser demo, or follow the installation guide.</p></noscript>
  </div>
</dialog>
