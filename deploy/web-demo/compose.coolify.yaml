services:
  iris-demo:
    # nginx/docker-nginx-unprivileged stable-alpine OCI index, verified 2026-10-12.
    image: nginxinc/nginx-unprivileged@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    expose: ["8080"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      # Pre-create both host paths. Short syntax retains :ro when Coolify parses
      # a Docker Compose Empty service as well as a Git-based application.
      - /srv/iris-demo/site:/srv/iris-demo/site:ro
      - /srv/iris-demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
